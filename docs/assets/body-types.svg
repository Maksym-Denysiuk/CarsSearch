      <path class="bt-shape" d="M6,37 L6,27 L22,25 L34,13 L70,13 L86,15 L90,26 L90,37 Z"/>
      <circle class="bt-wheel" cx="26" cy="37" r="7"/>
      <circle class="bt-wheel" cx="76" cy="37" r="7"/>
    </g>
    <text class="bt-label" x="375" y="92">Estate</text>
  </g>

  <g id="coupe" class="bt-option" data-body-type="coupe">
