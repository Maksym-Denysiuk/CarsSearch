<svg xmlns="http://www.w3.org/2000/svg" width="600" height="336" viewBox="0 0 600 336"
     role="group" aria-label="Car body types" class="body-type-chart">
  <!--
    Body-type silhouettes. Every g element's id is a value of the body_type enum
    in docs/request.schema.json and docs/results.schema.json, so this chart IS
    the enum's documentation: if a shape has no matching enum value (or the
    other way round) something is out of sync. tools/verify.py asserts it.

    Drawn here rather than hot-linked so the site owns its own assets: no usage
    rights to borrow, no third-party availability to depend on, no mixed-content
    risk, and the labels are in the same language as the rest of the UI.

    Line art only: stroke="currentColor" everywhere, so it inherits the page's
    light/dark theme with no per-theme copies.

    Keep this file valid XML (no double hyphens inside comments): it is served
    as image/svg+xml, so a parse error breaks it everywhere except innerHTML.
  -->
  <style>
    .bt-hit { fill: transparent; stroke: none; }
    .bt-shape { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .bt-wheel { fill: none; stroke: currentColor; stroke-width: 2; }
    .bt-label { fill: currentColor; font-family: inherit; font-size: 12px; text-anchor: middle; }
  </style>

  <g id="hatchback" class="bt-option" data-body-type="hatchback">
    <rect class="bt-hit" x="6" y="6" width="138" height="100" rx="10"/>
    <g transform="translate(25,18)">
      <path class="bt-shape" d="M6,37 L6,27 L24,25 L34,12 L58,12 L86,26 L92,26 L92,37 Z"/>
      <circle class="bt-wheel" cx="26" cy="37" r="7"/>
      <circle class="bt-wheel" cx="76" cy="37" r="7"/>
    </g>
    <text class="bt-label" x="75" y="92">Hatchback</text>
  </g>

  <g id="sedan" class="bt-option" data-body-type="sedan">
    <rect class="bt-hit" x="156" y="6" width="138" height="100" rx="10"/>
    <g transform="translate(175,18)">
      <path class="bt-shape" d="M6,37 L6,27 L22,25 L34,13 L52,13 L64,22 L88,22 L92,25 L92,37 Z"/>
      <circle class="bt-wheel" cx="26" cy="37" r="7"/>
      <circle class="bt-wheel" cx="76" cy="37" r="7"/>
    </g>
    <text class="bt-label" x="225" y="92">Sedan</text>
  </g>

  <g id="estate" class="bt-option" data-body-type="estate">
