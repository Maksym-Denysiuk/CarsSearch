name: Sync request manifest

# Runs tools/sync_requests.py whenever a request.json is added or changed
# (e.g. a manual GitHub web upload, which has no way to also create its
# sibling results.json/favorites.json or update Requests/index.json) and
# commits the regenerated manifest + any missing stub files back.
#
# The path filter is deliberately scoped to request.json only: this
# workflow's own commit touches index.json/results.json/favorites.json,
# never request.json, so it can never re-trigger itself. "[skip ci]" in the
# commit message is a second, redundant guard against that.

on:
  push:
    branches: [master]
    paths:
      - "Requests/**/request.json"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-requests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verify dependency
        run: python -m pip install jsonschema

      - name: Regenerate manifest and fill in missing stubs
        run: python tools/sync_requests.py

      - name: Verify
        run: python tools/verify.py

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Requests/
          git commit -m "chore: sync Requests/index.json and stub files [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
